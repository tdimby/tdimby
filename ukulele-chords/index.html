<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Uke Chords</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14807f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Uke Chords">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Uke Chords</h1>
    <p class="subtitle">Where your fingers go, string by string</p>
  </header>

  <main>
    <div class="search-row">
      <input id="search" type="text" placeholder="Search a chord — C, Am, G7…" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>

    <div class="categories" id="categories" role="tablist" aria-label="Chord category"></div>

    <div class="grid" id="chordGrid"></div>
  </main>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close" id="closeModal" aria-label="Close">&times;</button>
      <h2 id="modalTitle"></h2>
      <svg id="fretboard" viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chord diagram"></svg>
      <p class="hint">Numbers are which finger to press. An open ring means play that string open. An × means skip it.</p>
    </div>
  </div>

  <script src="chords.js"></script>
  <script src="script.js"></script>
</body>
</html>
